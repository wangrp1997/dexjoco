# Compliance Utility / Oracle P0 — frozen before outcomes.
protocol: ComplianceUtilityOracleP0
seed: 0
sidecar_dir: /mnt/hdd/dexjoco/interaction_sidecar/bimanual_assembly
horizon: 16
repeats: 2
actions:
  - hold
  - demo_matched
baseline_pos_gains: [400.0, 400.0, 400.0]
baseline_ori_gains: [200.0, 200.0, 200.0]
baseline_damping_ratio: 4.0
# Pre-registered gain configs (no post-hoc expansion).
gain_configs:
  - name: baseline
    mode: iso
    stiffness_scale: 1.0
  - name: soft_iso
    mode: iso
    stiffness_scale: 0.5
  - name: softer_iso
    mode: iso
    stiffness_scale: 0.25
  - name: axial_hard_lat_soft
    mode: task_aniso
    k_axial_scale: 1.0
    k_lateral_scale: 0.25
    ori_scale: 0.5
  - name: axial_soft_lat_hard
    mode: task_aniso
    k_axial_scale: 0.25
    k_lateral_scale: 1.0
    ori_scale: 0.5
  - name: axial_hard_lat_med
    mode: task_aniso
    k_axial_scale: 1.0
    k_lateral_scale: 0.5
    ori_scale: 0.75
discovery_roots:
  - {episode_index: 4, frame: 484, phase: pre_insert}
  - {episode_index: 6, frame: 271, phase: transport}
held_out_roots:
  - {episode_index: 9, frame: 407, phase: pre_insert}
  - {episode_index: 3, frame: 431, phase: pre_insert}
# Utility gates (do not retune after outcomes).
retention_slack: 0.05
tip_improve_eps: 0.002
oracle_vs_fixed_eps: 0.002
jam_force_thresh_n: 50.0
output_dir: outputs/compliance_utility_oracle_p0
manifest_path: data/manifests/compliance_utility_oracle_p0.json
report_path: docs/COMPLIANCE_UTILITY_ORACLE_P0_RESULT.md
